# Project-scoped Codex CLI MCP configuration.
# Open Godot, enable the Godot MCP plugin, and start its local server first.

[mcp_servers."godot-mcp"]
url = "http://localhost:9080/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60
default_tools_approval_mode = "prompt"
