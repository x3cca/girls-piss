# Project-scoped Codex CLI MCP configuration.
# The Date-or-Mate-2 addon speaks legacy SSE/HTTP; mcp-remote adapts it to
# Codex CLI's stdio MCP transport.

[mcp_servers."godot-mcp"]
command = "npx"
args = ["-y", "mcp-remote", "http://127.0.0.1:9080/mcp"]
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60
default_tools_approval_mode = "prompt"
